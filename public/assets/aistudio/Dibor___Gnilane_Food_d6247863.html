<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dibor &amp; Gnilane Food</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: sticky role bar, then a two-column workspace (content + cart/side panel) that stacks on phones. Palette from the logo bowl. */
:root{
  --bg:#fbf8f4; --surface:#ffffff; --sunk:#f3ece4; --line:#e6dbcf;
  --ink:#3b1f16; --muted:#7a5f52;
  --rust:#b8462e; --orange:#d4652a; --saffron:#e3a72f; --green:#1f6b42;
  --on-accent:#ffffff; --danger:#b3261e; --warn-bg:#fdf1d8; --ok-bg:#e3f2e8; --bad-bg:#fbe4e1;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1210; --surface:#251915; --sunk:#2f211c; --line:#45322a;
  --ink:#f6e9e0; --muted:#c3a998; --rust:#e0714f; --orange:#ec8a4f; --saffron:#f0bd55; --green:#5cbf86;
  --on-accent:#1b1210; --danger:#ff8a80; --warn-bg:#3b2d14; --ok-bg:#16301f; --bad-bg:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1210; --surface:#251915; --sunk:#2f211c; --line:#45322a;
  --ink:#f6e9e0; --muted:#c3a998; --rust:#e0714f; --orange:#ec8a4f; --saffron:#f0bd55; --green:#5cbf86;
  --on-accent:#1b1210; --danger:#ff8a80; --warn-bg:#3b2d14; --ok-bg:#16301f; --bad-bg:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.5rem} h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{width:44px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:2px}
.brand b{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em}
.brand b span{color:var(--orange)}
.brand small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
.roles{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;flex-wrap:wrap}
.roles a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.roles a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.demo{background:var(--warn-bg);font-size:.85rem}
.demo .wrap{padding-block:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:0;text-decoration:underline;color:var(--rust);font-weight:700;padding:0}
main{padding-block:20px 60px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.side{position:static}}
.steps{display:flex;flex-direction:column;gap:18px}
.step-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.step-h .n{font-family:var(--display);color:var(--orange);font-weight:800;font-size:1.3rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;min-width:0}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.chip small{display:block;font-size:.75rem;opacity:.8}
.place{flex:1 1 200px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:0;background:var(--sunk);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--saffron);color:#3b1f16}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.dish h3{font-size:1.05rem}
.dish p{margin:0;color:var(--muted);font-size:.88rem}
.dish .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.tag.al{background:var(--warn-bg);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--green)}
.tag.bad{background:var(--bad-bg);color:var(--danger)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--orange);color:var(--on-accent)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.green{background:var(--green);color:var(--on-accent)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.cart-line{display:flex;justify-content:space-between;gap:8px;padding-block:8px;border-bottom:1px dashed var(--line)}
.cart-line small{color:var(--muted);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;line-height:1}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:10px}
.sum .t{font-weight:800;font-size:1.1rem}
.note{font-size:.82rem;color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;font-size:.88rem}
.alert.warn{background:var(--warn-bg)} .alert.bad{background:var(--bad-bg);color:var(--danger)} .alert.ok{background:var(--ok-bg);color:var(--green)}
label{font-weight:700;font-size:.85rem;display:block;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
dialog{border:0;border-radius:16px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(30,15,10,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.opt-group{display:flex;flex-direction:column;gap:6px}
.opt-group label{font-weight:600;display:flex;gap:8px;align-items:center;margin:0}
.opt-group input{width:auto}
.ticket{border:2px dashed var(--saffron);border-radius:var(--r);padding:16px;text-align:center}
.code{font-family:var(--display);font-size:2.4rem;letter-spacing:.3em;color:var(--rust)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.order{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.order.s-confirmee{border-left-color:var(--saffron)} .order.s-preparation{border-left-color:var(--orange)} .order.s-prete{border-left-color:var(--green)} .order.s-livraison{border-left-color:var(--rust)} .order.s-incident{border-left-color:var(--danger)}
.order ul{margin:0;padding-left:18px}
.order .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.order .hd b{font-family:var(--display);font-size:1.15rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.full{background:var(--danger)} .bar i.mid{background:var(--saffron)}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.dish,.order{transition:transform .15s}.dish:hover{transform:translateY(-2px)}}
</style>

const KEY='dg-demo-v1';
let S = load() || seed();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.v===1?s:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function openDays(n){const out=[];const d=new Date();d.setHours(0,0,0,0);while(out.length<n){if(d.getDay()>1)out.push(ymd(d));d.setDate(d.getDate()+1)}return out}
function at(date,time){const [y,m,dd]=date.split('-').map(Number);const [h,mi]=time.split(':').map(Number);return new Date(y,m-1,dd,h,mi)}
function fmtDay(date){return at(date,'12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function shortDay(date){return at(date,'12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
function rnd(n){return Math.floor(Math.random()*n)}
function code(){return String(1000+rnd(9000))}
function seed(){
  const s={v:1,cfg:JSON.parse(JSON.stringify(DEFAULT_CFG)),orders:[],holds:[],quotes:[],log:[],seq:1040};
  const d=openDays(1)[0];

  mk('Awa (exemple)','retrait','12:00',[{pid:'yassa',name:'Yassa poulet',qty:2,unit:1090,opts:['Piment à part']},{pid:'bissap',name:'Bissap',qty:2,unit:250,opts:[]}],'confirmee');
  mk('Moussa (exemple)','domicile','12:30',[{pid:'m-decouv',name:'Menu Découverte',qty:1,unit:1490,opts:['Mafé poulet'],al:['Arachide'],uses:{mafe:1}},{pid:'alloco',name:'Alloco',qty:1,unit:350,opts:[]}],'preparation');
  mk('École partenaire (exemple)','ecole','12:00',[{pid:'p-afr',name:'Pause africaine',qty:8,unit:850,opts:['Yassa poulet']},{pid:'p-veg',name:'Pause végétarienne',qty:3,unit:800,opts:[]}],'prete');
  return s;
}
function logA(what,ref){S.log.unshift({at:Date.now(),what,ref});S.log=S.log.slice(0,60)}

// ---------- Règles serveur (simulées) ----------
function liveHolds(){const now=Date.now();S.holds=S.holds.filter(h=>h.exp>now);return S.holds}
const ACTIVE=['confirmee','preparation','prete','livraison','incident','livree'];
function slotUsed(date,time){return S.orders.filter(o=>o.date===date&&o.time===time&&ACTIVE.includes(o.status)).length+liveHolds().filter(h=>h.date===date&&h.time===time).length}
function stockUsed(date,pid){let n=0;const add=(uses,q)=>{for(const k in uses)if(k===pid)n+=uses[k]*q};
  S.orders.filter(o=>o.date===date&&o.status!=='annulee').forEach(o=>o.lines.forEach(l=>add(usesOf(l),l.qty)));
  liveHolds().filter(h=>h.date===date).forEach(h=>h.lines.forEach(l=>add(usesOf(l),l.qty)));return n}
function usesOf(l){if(l.uses)return l.uses;const p=PM[l.pid];const u={};if(p&&p.uses)p.uses.forEach(x=>u[x]=1);else if(p&&S.cfg.stock[p.id]!=null)u[p.id]=1;return u}
function stockLeft(date,pid){const max=S.cfg.stock[pid];if(max==null)return Infinity;return max-stockUsed(date,pid)}
function offered(p,date){if(S.cfg.off[p.id])return {ok:false,why:'Indisponible'};
  if(p.preco&&date===ymd(new Date()))return {ok:false,why:'Sur précommande (la veille)'};
  if(Array.isArray(p.days)&&!p.days.includes(at(date,'12:00').getDay()))return {ok:false,why:'Plat du jour : '+p.days.map(x=>['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][x]).join(', ')};
  const deps=p.uses||(S.cfg.stock[p.id]!=null?[p.id]:[]);for(const d of deps){const l=stockLeft(date,d);if(l<=0)return {ok:false,why:'Épuisé pour ce jour'};}
  return {ok:true}}
function cutoff(place,date,time){if(place&&place.school){const d=at(date,'20:00');d.setDate(d.getDate()-1);return d}return new Date(at(date,time).getTime()-60*60000)}
function slotState(place,date,time){const used=slotUsed(date,time);const cap=S.cfg.cap;
  if(Date.now()>cutoff(place,date,time))return {ok:false,why:'Fermé',used,cap};
  if(used>=cap)return {ok:false,why:'Complet',used,cap};return {ok:true,used,cap}}
function priceCart(cart,place){const sub=cart.reduce((a,l)=>a+l.unit*l.qty,0);let fee=place?place.fee:0;const errs=[];
  if(place&&place.min&&sub<place.min)errs.push('Minimum de commande en livraison : '+E(place.min)+'.');
  const meals=cart.filter(l=>['plats','formules','scolaire'].includes(PM[l.pid].cat)).reduce((a,l)=>a+l.qty,0);
  return {sub,fee,total:sub+fee,errs,meals}}

  tick();timer=setInterval(tick,1000);
  const release=(msg)=>{clearInterval(timer);S.holds=S.holds.filter(x=>x.id!==H.id);save();C.view='menu';C.hold=null;toast(msg);vClient()};
  document.getElementById('pOk').onclick=()=>{clearInterval(timer);S.holds=S.holds.filter(x=>x.id!==H.id);S.seq++;
    const o={id:'DG-'+S.seq,name:C.form.name,phone:C.form.phone,place:C.place,addr:C.form.addr,date:H.date,time:H.time,lines:H.lines,fee:H.fee,total:H.total,status:'confirmee',pay:'payé',code:code(),created:Date.now(),hist:[{at:Date.now(),what:'Paiement vérifié, commande confirmée'}]};
    S.orders.push(o);logA('Commande confirmée',o.id);save();C.last=o.id;C.cart=[];C.hold=null;C.view='done';vClient()};
  document.getElementById('pKo').onclick=()=>{document.getElementById('pMsg').innerHTML='<p class="alert bad" style="margin:0">Paiement refusé par la banque. Aucune commande n’a été créée et rien n’est envoyé en cuisine. Vous pouvez réessayer tant que la réservation est active.</p>'};
  document.getElementById('pAb').onclick=()=>release('Paiement abandonné : créneau et plats libérés.');
}
function vDone(){const o=S.orders.find(x=>x.id===C.last);const place=PLACES.find(p=>p.id===o.place);
  app.innerHTML=`<div class="panel" style="max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
   <h2>Merci, votre commande est confirmée</h2>
   <div class="ticket"><div class="note">Commande ${h(o.id)} · ${h(place.name)}</div><div style="font-weight:700">${h(fmtDay(o.date))} à ${o.time}</div><div class="note" style="margin-top:8px">Votre code de remise</div><div class="code tab">${o.code}</div><div class="note">À donner ${place.addr?'au livreur':'au comptoir'} pour récupérer votre repas.</div></div>
   <p class="note" style="margin:0">Un e-mail de confirmation vous est envoyé. Vous serez prévenu au départ de la commande et en cas de retard.</p>
   <div class="acts"><button class="btn" id="again">Nouvelle commande</button><a class="btn ghost" href="#cuisine" style="text-decoration:none">Voir l’écran cuisine</a></div></div>`;
  document.getElementById('again').onclick=()=>{C.view='menu';vClient()}}
function vEvent(){
  const min=new Date(Date.now()+72*3600000);
  const PL=[{n:'Plateau Essentiel',d:'Yassa ou mafé poulet, riz compris',p:1050},{n:'Plateau Convivial',d:'2 pastels + yassa ou mafé poulet + bissap 25 cl',p:1400},{n:'Plateau Festif',d:'2 pastels + yassa ou mafé poulet + bissap 25 cl + thiakry',p:1650},{n:'Prestation personnalisée',d:'Buffet, poisson ou besoins particuliers',p:0}];
  app.innerHTML=`<div class="panel" style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px">
   <h2>Demande de devis pour un événement</h2>
   <p class="note" style="margin:0">À partir de 20 personnes, avec un même plat principal pour le groupe. Demande au moins 72 heures avant. Ceci est une demande, pas une commande ferme : nous vous envoyons un devis daté à accepter.</p>
   <div class="menu">${PL.map((x,i)=>`<label class="dish" style="cursor:pointer"><span style="display:flex;gap:8px;align-items:center"><input type="radio" name="pl" value="${i}" style="width:auto" ${i?'':'checked'}><b>${h(x.n)}</b></span><span class="note">${h(x.d)}</span><span class="price">${x.p?'À partir de '+E(x.p)+' / pers.':'Sur devis'}</span></label>`).join('')}</div>
   <form id="ev" class="form">
    <div><label for="e-date">Date</label><input type="date" id="e-date" required min="${ymd(min)}" value="${ymd(new Date(min.getTime()+7*86400000))}"></div>
    <div><label for="e-n">Nombre de personnes</label><input type="number" id="e-n" min="20" value="35" required></div>
    <div><label for="e-place">Lieu</label><input id="e-place" required value="Salle des fêtes (exemple)"></div>
    <div><label for="e-contact">Contact</label><input id="e-contact" required value="Organisateur (exemple)"></div>
    <div style="grid-column:1/-1"><label for="e-notes">Contraintes, allergies, transport, installation</label><textarea id="e-notes" rows="3">Livraison et installation à prévoir.</textarea></div>
    <div style="grid-column:1/-1" class="acts"><button class="btn" type="submit">Envoyer la demande</button><button class="btn sec" type="button" id="back">Retour à la carte</button><span class="note" id="est"></span></div></form></div>`;
  const est=()=>{const pl=PL[+app.querySelector('[name=pl]:checked').value];const n=+document.getElementById('e-n').value||0;document.getElementById('est').textContent=pl.p?'Estimation indicative : '+E(pl.p*n)+' hors transport et installation':'Prix sur devis'};
  app.querySelectorAll('[name=pl]').forEach(r=>r.onchange=est);document.getElementById('e-n').oninput=est;est();
  document.getElementById('back').onclick=()=>{C.view='menu';vClient()};
  document.getElementById('ev').onsubmit=(e)=>{e.preventDefault();const pl=PL[+app.querySelector('[name=pl]:checked').value];const n=+document.getElementById('e-n').value;
    if(n<20)return toast('Les événements commencent à 20 personnes');
    S.quotes.unshift({id:'EV-'+(100+S.quotes.length+1),offer:pl.n,unit:pl.p,n,date:document.getElementById('e-date').value,place:document.getElementById('e-place').value,contact:document.getElementById('e-contact').value,notes:document.getElementById('e-notes').value,status:'Demande reçue',created:Date.now()});
    logA('Demande de devis reçue',S.quotes[0].id);save();toast('Demande envoyée : vous recevrez un devis');C.view='menu';vClient()};
}

// ----- Cuisine -----
const LBL={confirmee:'À préparer',preparation:'En préparation',prete:'Prête',livraison:'En livraison',livree:'Remise',incident:'Incident',annulee:'Annulée'};
function oCard(o,acts){const place=PLACES.find(p=>p.id===o.place);const al=[...new Set(o.lines.flatMap(l=>l.al||PM[l.pid].al||[]))];
  return `<article class="order s-${o.status}"><div class="hd"><b>${h(o.id)}</b><span class="tag">${LBL[o.status]}</span></div>
   <div class="note">${h(shortDay(o.date))} · <b class="tab">${o.time}</b> · ${h(place.name)}${o.example?' · exemple':''}</div>
   <ul>${o.lines.map(l=>`<li><b class="tab">${l.qty} ×</b> ${h(l.name)}${l.opts&&l.opts.length?` <span class="note">(${h(l.opts.join(', '))})</span>`:''}</li>`).join('')}</ul>
   ${al.length?`<div>${al.map(a=>`<span class="tag al">${h(a)}</span>`).join(' ')}</div>`:''}
   ${o.incident?`<p class="alert bad" style="margin:0">${h(o.incident)}</p>`:''}
   <div class="acts">${acts}</div></article>`}
function vKitchen(){
  const list=S.orders.filter(o=>['confirmee','preparation','prete'].includes(o.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const col=(st,title,act)=>{const l=list.filter(o=>o.status===st);return `<div class="section"><div class="sec-h"><h2>${title} <span class="note">(${l.length})</span></h2></div>${l.length?`<div class="board">${l.map(o=>oCard(o,act(o))).join('')}</div>`:'<p class="empty">Aucune commande.</p>'}</div>`};
  app.innerHTML=`<p class="note" style="margin:0 0 14px">Écran cuisine : commandes triées par heure de départ. La cuisine voit les plats, options et allergènes, sans données de paiement.</p>
   ${col('confirmee','À préparer',o=>`<button class="btn" data-go="${o.id}|preparation">Commencer</button>`)}
   ${col('preparation','En préparation',o=>`<button class="btn green" data-go="${o.id}|prete">Marquer prête</button>`)}
   ${col('prete','Prêtes à partir',o=>`<span class="note">En attente de remise ou du livreur</span>`)}`;
  bindGo();
}
function bindGo(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const [id,st]=b.dataset.go.split('|');setStatus(id,st);route()})}
function setStatus(id,st,why){const o=S.orders.find(x=>x.id===id);o.status=st;o.hist.push({at:Date.now(),what:LBL[st]+(why?' : '+why:'')});logA(LBL[st]+(why?' ('+why+')':''),id);save();toast(id+' : '+LBL[st])}

// ----- Remise & livraison -----
function vDeliver(){
  const pick=S.orders.filter(o=>o.place==='retrait'&&o.status==='prete');
  const ready=S.orders.filter(o=>o.place!=='retrait'&&o.status==='prete');
  const road=S.orders.filter(o=>['livraison','incident'].includes(o.status));
  const blk=(title,l,act,sub)=>`<div class="section"><div class="sec-h"><h2>${title} <span class="note">(${l.length})</span></h2>${sub?`<span class="note">${sub}</span>`:''}</div>${l.length?`<div class="board">${l.map(o=>oCard(o,act(o))+'').join('')}</div>`:'<p class="empty">Rien pour le moment.</p>'}</div>`;
  const dest=o=>`<div class="note">${h(o.addr||PLACES.find(p=>p.id===o.place).sub)} · ${h(o.name)} · ${h(o.phone)}</div>`;
  app.innerHTML=`<p class="note" style="margin:0 0 14px">Le livreur ne voit que les commandes de sa tournée et le contact nécessaire. La remise se valide par le code du client, ou par une dérogation motivée qui identifie l’opérateur.</p>
   ${blk('Retraits au comptoir',pick,o=>`<button class="btn green" data-hand="${o.id}">Remettre (code)</button>`)}
   ${blk('À prendre en charge',ready,o=>`<button class="btn" data-go="${o.id}|livraison">Partir en livraison</button>`)}
   ${blk('En cours de livraison',road,o=>`${dest(o)}<button class="btn green" data-hand="${o.id}">Valider la remise</button><button class="btn sec" data-inc="${o.id}">Retard ou incident</button>`)}`;
  bindGo();
  app.querySelectorAll('[data-hand]').forEach(b=>b.onclick=()=>handDialog(b.dataset.hand));
  app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>incDialog(b.dataset.inc));
}
function handDialog(id){const o=S.orders.find(x=>x.id===id);o.tries=o.tries||0;
  dlg.innerHTML=`<form class="dlg" id="hf"><h2>Remise de ${h(id)}</h2><div><label for="h-code">Code donné par le client</label><input id="h-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 chiffres"></div>
   <p class="note" style="margin:0">Démo : le code est <b class="tab">${o.code}</b>. Tentatives restantes : <span class="tab">${3-o.tries}</span>.</p><div id="hm"></div>
   <details><summary>Le client n’a pas son code</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><label for="h-why">Motif de la dérogation (obligatoire)</label><input id="h-why" placeholder="Ex. identité vérifiée par téléphone"><button class="btn sec" type="button" id="hd">Valider par dérogation</button></div></details>
   <div class="acts" style="justify-content:flex-end"><button class="btn sec" type="button" id="hx">Fermer</button><button class="btn green" type="submit" ${o.tries>=3?'disabled':''}>Valider</button></div></form>`;
  dlg.querySelector('#hx').onclick=()=>dlg.close();
  dlg.querySelector('#hd').onclick=()=>{const w=document.getElementById('h-why').value.trim();if(w.length<5)return document.getElementById('hm').innerHTML='<p class="alert bad" style="margin:0">Indiquez un motif précis.</p>';dlg.close();setStatus(id,'livree','dérogation par Livreur 1 : '+w);route()};
  dlg.querySelector('#hf').onsubmit=e=>{e.preventDefault();if(document.getElementById('h-code').value===o.code){dlg.close();setStatus(id,'livree','code vérifié');route()}else{o.tries++;save();document.getElementById('hm').innerHTML=`<p class="alert bad" style="margin:0">Code incorrect. ${o.tries>=3?'Nombre maximal de tentatives atteint : utilisez la dérogation.':'Tentatives restantes : '+(3-o.tries)+'.'}</p>`;if(o.tries>=3)dlg.querySelector('[type=submit]').disabled=true}};
  dlg.showModal()}
function incDialog(id){dlg.innerHTML=`<form class="dlg" id="if"><h2>Retard ou incident sur ${h(id)}</h2>
   <div><label for="i-type">Type</label><select id="i-type"><option>Retard</option><option>Client absent</option><option>Adresse introuvable</option><option>Problème sur la commande</option></select></div>
   <div><label for="i-eta">Nouvelle heure estimée</label><input id="i-eta" type="time" value="13:15"></div>
   <div><label for="i-why">Détail (obligatoire)</label><input id="i-why" required value="Circulation dense avenue de la Jonchère"></div>
   <div class="acts" style="justify-content:flex-end"><button class="btn sec" type="button" id="ix">Fermer</button><button class="btn" type="submit">Enregistrer et prévenir le client</button></div></form>`;
  dlg.querySelector('#ix').onclick=()=>dlg.close();
  dlg.querySelector('#if').onsubmit=e=>{e.preventDefault();const o=S.orders.find(x=>x.id===id);o.incident=document.getElementById('i-type').value+' · nouvelle estimation '+document.getElementById('i-eta').value+' · '+document.getElementById('i-why').value;dlg.close();setStatus(id,'incident',o.incident);route()};
  dlg.showModal()}

// ----- Administration -----
function vAdmin(){
  const days=openDays(6);C.adate=C.adate||days[0];const d=C.adate;
  const dayO=S.orders.filter(o=>o.date===d&&o.status!=='annulee');
  const ca=dayO.filter(o=>o.pay!=='remboursé').reduce((a,o)=>a+o.total,0);
  const allSlots=[...SLOTS.midi,...SLOTS.soir];const capTot=allSlots.length*S.cfg.cap;
  const meals=dayO.reduce((a,o)=>a+o.lines.filter(l=>['plats','formules','scolaire'].includes(PM[l.pid].cat)).reduce((x,l)=>x+l.qty,0),0);
  const school=dayO.filter(o=>o.place==='ecole').reduce((a,o)=>a+o.lines.reduce((x,l)=>x+l.qty,0),0);
  const stockIds=Object.keys(S.cfg.stock);
  app.innerHTML=`<div class="sec-h" style="margin-bottom:14px"><h2>Tableau de bord</h2><div class="chips">${days.map(x=>`<button class="chip" data-ad="${x}" aria-pressed="${x===d}">${h(shortDay(x))}</button>`).join('')}</div></div>
   <div class="kpis"><div class="kpi"><b>${dayO.length}</b><span>commandes</span></div><div class="kpi"><b>${E(ca)}</b><span>chiffre d’affaires TTC encaissé</span></div><div class="kpi"><b>${meals}</b><span>repas à préparer</span></div><div class="kpi"><b>${dayO.length} / ${capTot}</b><span>places de créneaux utilisées</span></div><div class="kpi"><b>${school}</b><span>repas école (seuil groupé : 10)</span></div></div>
   <div class="section"><div class="sec-h"><h2>Capacité par créneau</h2><label class="note" style="display:flex;gap:8px;align-items:center;margin:0">Commandes max. par créneau <input id="cap" type="number" min="1" max="99" value="${S.cfg.cap}" style="width:70px"></label></div>
    <div class="panel scroll"><table><thead><tr><th>Créneau</th><th>Commandes</th><th style="width:40%">Remplissage</th><th>État</th></tr></thead><tbody>
    ${allSlots.map(t=>{const u=slotUsed(d,t);const pc=Math.min(100,u/S.cfg.cap*100);const st=slotState(null,d,t);return `<tr><td class="tab"><b>${t}</b></td><td class="tab">${u} / ${S.cfg.cap}</td><td><div class="bar"><i class="${pc>=100?'full':pc>=70?'mid':''}" style="width:${pc}%"></i></div></td><td>${st.ok?'<span class="tag ok">Ouvert</span>':`<span class="tag ${st.why==='Complet'?'bad':''}">${st.why}</span>`}</td></tr>`}).join('')}
    </tbody></table></div></div>
   <div class="section"><h2>Produits et stock du jour</h2><div class="panel scroll"><table><thead><tr><th>Produit</th><th>Prix TTC</th><th>Stock du jour</th><th>Restant</th><th>En vente</th></tr></thead><tbody>
    ${P.filter(p=>p.cat==='plats'||stockIds.includes(p.id)).map(p=>{const left=stockLeft(d,p.id);return `<tr><td><b>${h(p.name)}</b>${p.preco?' <span class="tag">Précommande</span>':''}${Array.isArray(p.days)?' <span class="tag">Plat du jour</span>':''}</td><td class="tab">${E(p.price)}</td><td><input type="number" min="0" data-stock="${p.id}" value="${S.cfg.stock[p.id]??''}" style="width:80px"></td><td class="tab">${left===Infinity?'–':left<=0?'<span class="tag bad">Épuisé</span>':left}</td><td><input type="checkbox" data-off="${p.id}" ${S.cfg.off[p.id]?'':'checked'} style="width:auto" aria-label="${h(p.name)} en vente"></td></tr>`}).join('')}
    </tbody></table></div><p class="note" style="margin:0">Un produit retiré de la vente ne peut plus être commandé ; les commandes déjà passées restent inchangées.</p></div>
   <div class="section"><h2>Commandes du jour</h2><div class="panel scroll"><table><thead><tr><th>N°</th><th>Créneau</th><th>Client</th><th>Remise</th><th>Total</th><th>Statut</th><th>Paiement</th><th></th></tr></thead><tbody>
    ${dayO.length?dayO.sort((a,b)=>a.time.localeCompare(b.time)).map(o=>`<tr><td><b>${h(o.id)}</b></td><td class="tab">${o.time}</td><td>${h(o.name)}</td><td>${h(PLACES.find(p=>p.id===o.place).name)}</td><td class="tab">${E(o.total)}</td><td><span class="tag">${LBL[o.status]}</span></td><td><span class="tag ${o.pay==='payé'?'ok':'bad'}">${o.pay}</span></td><td>${o.pay==='payé'?`<button class="btn ghost" data-ref="${o.id}">Rembourser</button>`:''}</td></tr>`).join(''):'<tr><td colspan="8" class="note">Aucune commande pour ce jour.</td></tr>'}
    </tbody></table></div></div>
   <div class="section"><h2>Demandes d’événements</h2>${S.quotes.length?`<div class="panel scroll"><table><thead><tr><th>N°</th><th>Date</th><th>Offre</th><th>Personnes</th><th>Estimation</th><th>Contact</th><th>Statut</th></tr></thead><tbody>${S.quotes.map(q=>`<tr><td><b>${h(q.id)}</b></td><td>${h(q.date)}</td><td>${h(q.offer)}</td><td class="tab">${q.n}</td><td class="tab">${q.unit?E(q.unit*q.n):'Sur devis'}</td><td>${h(q.contact)}</td><td><span class="tag">${h(q.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Aucune demande. Elles arrivent depuis l’espace client, bouton « Événement de 20 personnes et plus ».</p>'}</div>
   <div class="section"><h2>Journal</h2><div class="panel">${S.log.length?S.log.slice(0,10).map(l=>`<div class="cart-line"><span>${h(l.what)} <b>${h(l.ref||'')}</b></span><span class="note tab">${new Date(l.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<p class="note">Les actions apparaîtront ici.</p>'}</div></div>`;
  app.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{C.adate=b.dataset.ad;vAdmin()});
  document.getElementById('cap').onchange=e=>{S.cfg.cap=Math.max(1,+e.target.value||1);logA('Capacité par créneau : '+S.cfg.cap);save();vAdmin()};
  app.querySelectorAll('[data-stock]').forEach(i=>i.onchange=()=>{S.cfg.stock[i.dataset.stock]=Math.max(0,+i.value||0);logA('Stock modifié : '+PM[i.dataset.stock].name);save();vAdmin()});
  app.querySelectorAll('[data-off]').forEach(i=>i.onchange=()=>{S.cfg.off[i.dataset.off]=!i.checked;logA((i.checked?'Remis en vente : ':'Retiré de la vente : ')+PM[i.dataset.off].name);save();vAdmin()});
  app.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>refDialog(b.dataset.ref));
}
function refDialog(id){const o=S.orders.find(x=>x.id===id);
  dlg.innerHTML=`<form class="dlg" id="rf"><h2>Rembourser ${h(id)}</h2><p class="note" style="margin:0">Montant payé : <b class="tab">${E(o.total)}</b>. Le remboursement passe par le prestataire de paiement et reste dans le journal.</p>
   <div><label for="r-why">Motif (obligatoire)</label><input id="r-why" required value="Créneau ne pouvant plus être honoré, client d’accord"></div>
   <div class="opt-group"><label><input type="checkbox" id="r-cancel" checked> Annuler aussi la commande</label></div>
   <div class="acts" style="justify-content:flex-end"><button class="btn sec" type="button" id="rx">Fermer</button><button class="btn" type="submit">Confirmer le remboursement</button></div></form>`;
  dlg.querySelector('#rx').onclick=()=>dlg.close();
  dlg.querySelector('#rf').onsubmit=e=>{e.preventDefault();const w=document.getElementById('r-why').value;o.pay='remboursé';o.hist.push({at:Date.now(),what:'Remboursement : '+w});logA('Remboursement '+E(o.total)+' : '+w,id);
    if(document.getElementById('r-cancel').checked){o.status='annulee';logA('Commande annulée',id)}save();dlg.close();toast('Remboursement enregistré');vAdmin()};
  dlg.showModal()}

route();
})();
</script>

</body></html>
